# Builds the collector image and pushes the same build to all three
# registries, then checks the digests match, the same way deploy.yml does for
# the app. It does not deploy anything. The collector is a sidecar whose
# shape Terraform owns, so each estate picks up a new collector digest from a
# variable on its next apply.
#
# Collector images go into the app's repositories under a collector- tag, so
# the deploy identities need no new permissions.
name: collector-image

on:
  push:
    branches: [main]
    paths: [collector/**]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  GCP_REPO: europe-west2-docker.pkg.dev/multicloud-platform-lab/platform-api/platform-api
  AWS_REGION: eu-west-2
  AWS_REPO: 495599741450.dkr.ecr.eu-west-2.amazonaws.com/platform-api
  ACR_NAME: moyoplatformacr
  AZURE_REPO: moyoplatformacr.azurecr.io/platform-api

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build once
        run: docker build -t collector:${GITHUB_SHA::7} collector

      - name: Push to all three registries
        run: |
          TAG=collector-${GITHUB_SHA::7}
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
          aws ecr get-login-password | docker login --username AWS --password-stdin ${AWS_REPO%%/*}
          az acr login --name $ACR_NAME
          for repo in $GCP_REPO $AWS_REPO $AZURE_REPO; do
            docker tag collector:${GITHUB_SHA::7} $repo:$TAG
            docker push --quiet $repo:$TAG
          done

      - name: Check the digests match
        run: |
          TAG=collector-${GITHUB_SHA::7}
          G=$(gcloud artifacts docker images describe $GCP_REPO:$TAG --format='value(image_summary.digest)')
          A=$(aws ecr describe-images --repository-name platform-api --image-ids imageTag=$TAG --query 'imageDetails[0].imageDigest' --output text)
          Z=$(az acr repository show --name $ACR_NAME --image platform-api:$TAG --query digest -o tsv)
          echo "gcp   $G"; echo "aws   $A"; echo "azure $Z"
          [ "$G" = "$A" ] && [ "$A" = "$Z" ] || { echo "Digests differ"; exit 1; }
          echo "### collector $TAG $G" >> "$GITHUB_STEP_SUMMARY"
