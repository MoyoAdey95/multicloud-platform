# Copies the AWS and Azure cost exports into BigQuery in the hub, next to the
# GCP billing export, which is read where it already is. Copied from
# multicloud-cost-reporting with its own identities in each cloud.
#
# The cost identities are separate from the deploy ones, so a deploy run
# cannot read billing data and an ingest run cannot deploy anything.
name: ingest

on:
  # Azure writes its file at about 20:10 UTC, so 21:00 leaves room. Scheduled
  # runs often start late, which does not matter for a daily load.
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# A manual run and the scheduled one replace the same partitions, so they
# queue rather than overlap.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT: multicloud-platform-lab
  LANDING_BUCKET: moyo-platform-cost-landing
  RAW_DATASET: cost_raw

jobs:
  aws:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.COST_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.COST_AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Load the AWS FOCUS export
        env:
          EXPORT_BUCKET: moyoadey-cost-exports
          EXPORT_PREFIX: cost-exports/focus-daily
        run: bash cost/ingest/aws.sh

  azure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.COST_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.COST_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Load the Azure actual cost export
        env:
          EXPORT_ACCOUNT: moyoadeycostexports
          EXPORT_CONTAINER: cost-exports
          EXPORT_PREFIX: azure/actualcost-daily
        run: bash cost/ingest/azure.sh
